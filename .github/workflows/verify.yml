# The gate of Avero.
#
# The justfile holds the same steps, and it is the source of truth. A change to
# a step belongs in both files. See AGENTS.md, "Definition of done".
name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 1. gofmt reports no file.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need a format:"
            echo "$out"
            exit 1
          fi

      # 2. go vet passes. The repository holds two modules: the host and the
      # CLI.
      - name: vet
        run: |
          go vet ./...
          cd cli && go vet ./...

      # 3. golangci-lint passes. The version is pinned, because a linter that
      # a lower Go version built refuses the target of go.mod.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: cli

      # 4. Unit tests pass with the race detector.
      - name: test
        run: |
          go test ./... -race -count=1
          cd cli && go test ./... -race -count=1

      # 7. Every generated file is current.
      - name: generate
        run: |
          go run ./internal/cmd/averogen -check .
          go generate ./...
          git diff --exit-code -- '*zz_generated*.go'

      # 5, 6. Integration tests. The asset suite downloads the Tailwind binary
      # and one module from a CDN.
      - name: integration
        run: |
          cd cli
          go test ./pipeline/... -race -tags=integration -timeout 10m
          go test ./internal/cli/... -tags=integration -run 'TestTheDoctor|TestTheRoutesAndThe|TestVerifyRuns|TestTheSpaBinary|TestTheOpenAPI|TestTheGeneratedModulesHoldARepository' -timeout 20m
          go test ./dev/... -tags=integration -run TestTheProductionBuild -timeout 10m
          go test ./mcp/... -tags=integration -timeout 20m

      # 8, 9. The three reference applications.
      - name: examples
        run: |
          go run ./cli/internal/cmd/averoexamples -check
          cd cli && go test ./internal/cli/... -tags=integration -run TestEachShapeScaffolds -timeout 20m
          # A clone holds no built asset, because an example ignores its
          # output directory.
          go run ./cli/internal/cmd/averoexamples -assets
          cd examples/blog && GOWORK=off go build ./... && GOWORK=off go test ./... -count=1 && cd ../..
          cd examples/board && GOWORK=off go build ./... && GOWORK=off go test ./... -count=1 && cd ../..
          cd examples/orders && GOWORK=off go build ./... && GOWORK=off go test ./... -count=1

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Section 3 of the SDD states the measurement: an Apple Silicon laptop with
    # a warm build cache. A shared runner is slower, so this job records the
    # numbers and never stops the gate. The laptop enforces the budgets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: measure
        run: |
          cd cli
          go test ./internal/cli/... -tags=integration -run TestDX1 -timeout 15m -v
          go test ./dev/... -tags=integration -run 'TestDX2|TestDX3' -timeout 15m -v

      - name: report
        if: always()
        run: cat artifacts/verification.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/
          if-no-files-found: ignore
